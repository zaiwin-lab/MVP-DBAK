name: Deploy to Netlify

on:
  push:
    branches: [claude/gstack-impecable-uiui-2725z3]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: npm run check

      - name: Require Netlify token
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          echo "::error::NETLIFY_AUTH_TOKEN secret is not set. Add it in Settings → Secrets and variables → Actions (create the token at app.netlify.com → User settings → Applications → Personal access tokens)."
          exit 1

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 2532ebfd-4237-4c67-b4e5-fc6a437f4f2b
        run: >
          npx --yes netlify-cli@17 deploy
          --dir=out
          --prod
          --message "GitHub Actions ${{ github.sha }}"
